<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Room Planner</title>
  <desc id="desc">An isometric room and desk mark in charcoal and amber</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171612"/>
      <stop offset="1" stop-color="#292720"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5cd63"/>
      <stop offset="1" stop-color="#d79516"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="944" height="264" rx="38" fill="url(#bg)" stroke="#3b382f" stroke-width="2"/>
  <g transform="translate(70 38)" filter="url(#shadow)">
    <path d="M18 72 126 10l108 62-108 62Z" fill="#eee8d9"/>
    <path d="M18 72v88l108 62v-88Z" fill="#b7b0a1"/>
    <path d="M234 72v88l-108 62v-88Z" fill="#d4cdbd"/>
    <path d="M18 72 126 134 234 72" fill="none" stroke="#0c0b09" stroke-width="8" stroke-linejoin="round"/>
    <path d="M18 72v88l108 62m108-150v88l-108 62" fill="none" stroke="#0c0b09" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M65 105 129 68l62 36-64 37Z" fill="url(#gold)" stroke="#0c0b09" stroke-width="7" stroke-linejoin="round"/>
    <path d="M77 114v37m99-38v37m-48-10v42" fill="none" stroke="#0c0b09" stroke-width="7" stroke-linecap="round"/>
    <circle cx="211" cy="99" r="9" fill="#f5c451" stroke="#0c0b09" stroke-width="5"/>
  </g>

  <g transform="translate(350 77)">
    <text x="0" y="55" fill="#f6f1e7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">ROOM PLANNER</text>
    <rect x="2" y="79" width="84" height="7" rx="3.5" fill="url(#gold)"/>
    <text x="105" y="91" fill="#aaa292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="4">PLAN · PLACE · EXPERIENCE</text>
